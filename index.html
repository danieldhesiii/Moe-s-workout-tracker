<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>Moe — Training Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-inner">
        <div class="header-brand">
          <span class="brand-mark">M</span>
          <div class="brand-text">
            <span class="brand-name">Moe's Log</span>
            <span class="brand-date" id="headerDate">—</span>
          </div>
        </div>
        <button class="streak-chip" id="streakChip" title="Sessions logged this week">
          <span class="streak-num" id="streakNum">0</span>
          <span class="streak-label">this wk</span>
        </button>
      </div>
    </header>

    <!-- Main scroll area -->
    <main id="view" class="view"></main>

    <!-- Bottom navigation -->
    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="today">
        <svg viewBox="0 0 24 24" class="tab-ic"><path d="M12 3l8 6v11H4V9l8-6z"/></svg>
        <span>Today</span>
      </button>
      <button class="tab" data-tab="plan">
        <svg viewBox="0 0 24 24" class="tab-ic"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16M9 3v4M15 3v4"/></svg>
        <span>Plan</span>
      </button>
      <button class="tab tab-log" data-tab="log">
        <svg viewBox="0 0 24 24" class="tab-ic"><path d="M12 5v14M5 12h14"/></svg>
        <span>Log</span>
      </button>
      <button class="tab" data-tab="progress">
        <svg viewBox="0 0 24 24" class="tab-ic"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/></svg>
        <span>Progress</span>
      </button>
      <button class="tab" data-tab="goals">
        <svg viewBox="0 0 24 24" class="tab-ic"><path d="M12 2v6M12 22a7 7 0 100-14 7 7 0 000 14z"/><circle cx="12" cy="15" r="3"/></svg>
        <span>Goals</span>
      </button>
    </nav>
  </div>

  <!-- Sheet / modal mount -->
  <div id="sheet-root"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
