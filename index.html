<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffd8e6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Moe's Log" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Moe — Training Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="vendor/swiper-bundle.min.css?v=17" />
  <link rel="stylesheet" href="vendor/splitting.css?v=17" />
  <link rel="stylesheet" href="styles.css?v=20" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-inner">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="header-brand">
          <span class="brand-mark">M</span>
          <div class="brand-text">
            <span class="brand-name">Moe's Log</span>
            <span class="brand-date" id="headerDate">—</span>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span id="syncDot" class="sync-dot ok" title="Synced to cloud"></span>
          <button class="streak-chip" id="streakChip" title="Sessions done vs planned this week">
            <span class="streak-num" id="streakNum">0/5</span>
            <span class="streak-label">this wk</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main scroll area -->
    <main id="view" class="view"></main>

    <!-- Bottom navigation -->
    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="today">
        <svg viewBox="0 0 24 24" class="tab-ic"><path d="M12 3l8 6v11H4V9l8-6z"/></svg>
        <span>Today</span>
      </button>
      <button class="tab" data-tab="plan">
        <svg viewBox="0 0 24 24" class="tab-ic"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16M9 3v4M15 3v4"/></svg>
        <span>Plan</span>
      </button>
      <button class="tab" data-tab="favorites">
        <svg viewBox="0 0 24 24" class="tab-ic"><path d="M12 3.5l2.6 5.3 5.8.85-4.2 4.1 1 5.75L12 16.9l-5.2 2.6 1-5.75-4.2-4.1 5.8-.85L12 3.5z"/></svg>
        <span>Saved</span>
      </button>
      <button class="tab tab-log" data-tab="log">
        <svg viewBox="0 0 24 24" class="tab-ic"><path d="M12 5v14M5 12h14"/></svg>
        <span>Log</span>
      </button>
      <button class="tab" data-tab="progress">
        <svg viewBox="0 0 24 24" class="tab-ic"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/></svg>
        <span>Stats</span>
      </button>
      <button class="tab" data-tab="goals">
        <svg viewBox="0 0 24 24" class="tab-ic"><path d="M12 2v6M12 22a7 7 0 100-14 7 7 0 000 14z"/><circle cx="12" cy="15" r="3"/></svg>
        <span>Goals</span>
      </button>
      <button class="tab" data-tab="library">
        <svg viewBox="0 0 24 24" class="tab-ic"><path d="M4 19V5h3v14H4zM9 19V5h2v14H9zM13 5l4 14M17 5l2 14"/></svg>
        <span>Library</span>
      </button>
    </nav>
  </div>

  <!-- Sheet / modal mount -->
  <div id="sheet-root"></div>

  <script>
    window.addEventListener("error", function (e) {
      var v = document.getElementById("view");
      var msg = (e && e.message) ? e.message : String(e);
      var loc = (e && e.filename ? e.filename.split("/").pop() : "") + (e && e.lineno ? ":" + e.lineno : "");
      if (v) v.innerHTML =
        '<div style="padding:22px;font-family:ui-monospace,monospace;color:#c8442a;font-size:13px;line-height:1.6;white-space:pre-wrap">' +
        '<b>JS ERROR</b>\n' + msg + '\n' + loc + '</div>';
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Animation / interaction libraries (vendored for offline) -->
  <script src="vendor/gsap.min.js?v=17"></script>
  <script src="vendor/lenis.min.js?v=17"></script>
  <script src="vendor/splitting.min.js?v=17"></script>
  <script src="vendor/swiper-bundle.min.js?v=17"></script>
  <script src="config.js?v=20"></script>
  <script src="data.js?v=20"></script>
  <script src="app.js?v=20"></script>
</body>
</html>
